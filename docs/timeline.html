<title>Timeline</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="css/style.css">

<nav class="site-nav">
  <a href="gallery.html" data-i18n="nav.gallery">Gallery</a>
  <a href="timeline.html" aria-current="page" data-i18n="nav.timeline">Timeline</a>
  <a href="board.html" data-i18n="nav.board">Board</a>
  <a href="reel.html" data-i18n="nav.reel">Reel</a>
  <a href="cats.html" data-i18n="nav.cats">Fiyero &amp; Satine</a>
  <span class="spacer"></span>
  <a href="settings.html" class="nav-secondary" data-i18n="nav.settings">Settings</a>
  <button class="sign-out" data-sign-out data-i18n="nav.sign_out">Sign out</button>
</nav>

<main>
  <h1 data-i18n="timeline.title">Timeline</h1>
  <div class="timeline-nav" id="timeline-nav" hidden>
    <button type="button" id="tl-prev">▲</button>
    <span id="tl-current"></span>
    <button type="button" id="tl-next">▼</button>
  </div>
  <p class="loading-state" id="status" data-i18n="timeline.loading">Loading…</p>
  <div id="timeline"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script>
<script type="module">
  import { supabaseClient, R2_PUBLIC_URL } from './js/supabase-client.js';
  import { requireAuth, initSignOutButtons } from './js/auth-guard.js';
  import { ageLabel } from './js/age.js';
  import { applyStoredLanguage, syncLanguageFromProfile, t } from './js/i18n.js';

  const session = await requireAuth();
  initSignOutButtons();
  await syncLanguageFromProfile(supabaseClient, session.user.id);
  const dict = await applyStoredLanguage();

  document.getElementById('tl-prev').setAttribute('aria-label', t(dict, 'timeline.nav_prev'));
  document.getElementById('tl-next').setAttribute('aria-label', t(dict, 'timeline.nav_next'));

  const timelineEl = document.getElementById('timeline');
  const status = document.getElementById('status');

  const { data: collection, error: collectionError } = await supabaseClient
    .from('collections').select('id, reference_date').eq('slug', 'baby').single();

  if (collectionError) {
    status.textContent = t(dict, 'timeline.error_collection');
    throw collectionError;
  }

  const { data: media, error: mediaError } = await supabaseClient
    .from('media')
    .select('id, thumb_key, media_type, date_taken, is_live_photo_video')
    .eq('collection_id', collection.id)
    .eq('is_live_photo_video', false)
    .order('date_taken', { ascending: true });

  if (mediaError) {
    status.textContent = t(dict, 'timeline.error_media');
    throw mediaError;
  }

  if (media.length === 0 || !collection.reference_date) {
    status.textContent = media.length === 0
      ? t(dict, 'timeline.empty')
      : t(dict, 'timeline.empty_no_birthdate');
  } else {
    status.remove();
  }

  let currentLabel = null;
  let currentGrid = null;
  const groups = []; // { label, el } — one per age-group heading, in document order

  for (const item of media) {
    const label = collection.reference_date ? ageLabel(item.date_taken, collection.reference_date, dict, t) : null;
    if (label && label !== currentLabel) {
      currentLabel = label;
      const group = document.createElement('section');
      group.className = 'timeline-group';
      const heading = document.createElement('h2');
      heading.textContent = label;
      group.appendChild(heading);
      currentGrid = document.createElement('div');
      currentGrid.className = 'media-grid';
      group.appendChild(currentGrid);
      timelineEl.appendChild(group);
      groups.push({ label, el: heading });
    }
    if (!currentGrid) continue;

    const a = document.createElement('a');
    a.href = `media.html?id=${item.id}&from=timeline`;
    a.dataset.mediaId = item.id;

    const img = document.createElement('img');
    img.src = `${R2_PUBLIC_URL}/${item.thumb_key}`;
    img.loading = 'lazy';
    img.alt = '';
    a.appendChild(img);

    if (item.media_type === 'video') {
      const badge = document.createElement('span');
      badge.className = 'video-badge';
      badge.textContent = '▶';
      a.appendChild(badge);
    }

    currentGrid.appendChild(a);
  }

  // Month nav — arrows step between age-group headings; a scroll listener
  // (IntersectionObserver below) keeps the label in sync when someone just
  // scrolls by hand instead of tapping an arrow.
  if (groups.length) {
    const nav = document.getElementById('timeline-nav');
    const prevBtn = document.getElementById('tl-prev');
    const nextBtn = document.getElementById('tl-next');
    const currentLabelEl = document.getElementById('tl-current');
    nav.hidden = false;

    let idx = 0;
    function setIdx(i) {
      idx = Math.max(0, Math.min(groups.length - 1, i));
      currentLabelEl.textContent = groups[idx].label;
      prevBtn.disabled = idx === 0;
      nextBtn.disabled = idx === groups.length - 1;
    }
    prevBtn.addEventListener('click', () => {
      setIdx(idx - 1);
      groups[idx].el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    nextBtn.addEventListener('click', () => {
      setIdx(idx + 1);
      groups[idx].el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    setIdx(0);

    // rootMargin pushes the "trigger line" below both sticky bars (nav +
    // group heading) so a heading counts as "current" once it's actually
    // clear of them, not the instant it touches the raw viewport top.
    const observer = new IntersectionObserver((entries) => {
      const visible = entries.filter((e) => e.isIntersecting);
      if (!visible.length) return;
      const topMost = visible.reduce((a, b) => (a.boundingClientRect.top < b.boundingClientRect.top ? a : b));
      const i = groups.findIndex((g) => g.el === topMost.target);
      if (i !== -1) setIdx(i);
    }, { rootMargin: '-110px 0px -70% 0px', threshold: 0 });
    groups.forEach((g) => observer.observe(g.el));
  }

  // Coming back from a photo — scroll to where it actually was (including
  // the right age-group section) instead of resetting to the top.
  const scrollTo = new URLSearchParams(window.location.search).get('scrollTo');
  if (scrollTo) {
    timelineEl.querySelector(`[data-media-id="${scrollTo}"]`)?.scrollIntoView({ block: 'center' });
  }
</script>
