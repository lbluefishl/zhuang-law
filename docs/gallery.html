<title>River</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="css/style.css">

<nav class="site-nav">
  <a href="gallery.html" aria-current="page" data-i18n="nav.gallery">River</a>
  <a href="timeline.html" data-i18n="nav.timeline">Current</a>
  <a href="board.html" data-i18n="nav.board">Well</a>
  <a href="reel.html" data-i18n="nav.reel">Stream</a>
  <span class="spacer"></span>
  <a href="cats.html" class="nav-secondary" data-i18n="nav.cats">Fiyero &amp; Satine</a>
  <a href="settings.html" class="nav-secondary" data-i18n="nav.settings">Settings</a>
  <button class="sign-out" data-sign-out data-i18n="nav.sign_out">Sign out</button>
</nav>

<main>
  <h1 data-i18n="gallery.title">River</h1>
  <div class="gallery-controls">
    <div class="gallery-tabs" id="gallery-tabs">
      <button type="button" class="gallery-tab" data-tab="all" aria-current="page" data-i18n="gallery.tab_all">All</button>
      <button type="button" class="gallery-tab" data-tab="favorites" id="favorites-tab"></button>
    </div>
    <label class="sort-control">
      <span data-i18n="gallery.sort_label">Sort by</span>
      <select id="sort-select">
        <option value="date_desc" data-i18n="gallery.sort_date_desc">Date (newest first)</option>
        <option value="date_asc" data-i18n="gallery.sort_date_asc">Date (oldest first)</option>
        <option value="likes" data-i18n="gallery.sort_likes">Likes</option>
        <option value="comments" data-i18n="gallery.sort_comments">Comments</option>
        <option value="views" data-i18n="gallery.sort_views">Views</option>
      </select>
    </label>
  </div>
  <p class="loading-state" id="status" data-i18n="gallery.loading">Loading…</p>
  <div class="media-grid" id="grid"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script>
<script type="module">
  import { supabaseClient, R2_PUBLIC_URL } from './js/supabase-client.js';
  import { requireAuth, initSignOutButtons } from './js/auth-guard.js';
  import { loadMyFavoriteIds } from './js/favorites.js';
  import { starIcon } from './js/icons.js';
  import { applyStoredLanguage, syncLanguageFromProfile, t } from './js/i18n.js';

  const session = await requireAuth();
  initSignOutButtons();
  await syncLanguageFromProfile(supabaseClient, session.user.id);
  const dict = await applyStoredLanguage();

  const grid = document.getElementById('grid');
  const status = document.getElementById('status');

  // Same star glyph as the per-photo favorite button (action-bar.js), not a
  // plain "★" character, so the icon actually matches everywhere it appears.
  document.getElementById('favorites-tab').innerHTML = `${starIcon(true)} ${t(dict, 'gallery.tab_favorites')}`;

  // v1 has one collection. Looked up by slug rather than hardcoded, per §5 —
  // pages are meant to be generated from the collections table.
  const { data: collection, error: collectionError } = await supabaseClient
    .from('collections').select('id').eq('slug', 'baby').single();

  if (collectionError) {
    status.textContent = t(dict, 'gallery.error_collection');
    throw collectionError;
  }

  const { data: media, error: mediaError } = await supabaseClient
    .from('media')
    .select('id, thumb_key, media_type, is_live_photo_video, date_taken, view_count')
    .eq('collection_id', collection.id)
    .eq('is_live_photo_video', false) // §6: the video half of a Live Photo pair stays hidden here
    .order('date_taken', { ascending: false });

  if (mediaError) {
    status.textContent = t(dict, 'gallery.error_media');
    throw mediaError;
  }

  const [favoriteIds, likeCounts, commentCounts] = await Promise.all([
    loadMyFavoriteIds(supabaseClient, session.user.id),
    countByMediaId('likes'),
    countByMediaId('comments', { excludeDeleted: true }),
  ]);

  // Raw per-media tallies for sorting — small enough at this scale (a family
  // site, not a public platform) to just fetch every row and count in JS
  // rather than lean on a fragile PostgREST embedded-count-with-filter query.
  async function countByMediaId(table, { excludeDeleted } = {}) {
    let query = supabaseClient.from(table).select('media_id');
    if (excludeDeleted) query = query.is('deleted_at', null);
    const { data, error } = await query;
    if (error) throw error;
    const counts = new Map();
    for (const row of data) counts.set(row.media_id, (counts.get(row.media_id) || 0) + 1);
    return counts;
  }

  const SORTERS = {
    date_desc: (a, b) => new Date(b.date_taken) - new Date(a.date_taken),
    date_asc: (a, b) => new Date(a.date_taken) - new Date(b.date_taken),
    likes: (a, b) => (likeCounts.get(b.id) || 0) - (likeCounts.get(a.id) || 0),
    comments: (a, b) => (commentCounts.get(b.id) || 0) - (commentCounts.get(a.id) || 0),
    views: (a, b) => (b.view_count || 0) - (a.view_count || 0),
  };

  function buildTile(item) {
    const a = document.createElement('a');
    a.href = `media.html?id=${item.id}&from=gallery`;
    a.dataset.mediaId = item.id;

    const img = document.createElement('img');
    img.src = `${R2_PUBLIC_URL}/${item.thumb_key}`;
    img.loading = 'lazy';
    img.alt = '';
    a.appendChild(img);

    if (item.media_type === 'video') {
      const badge = document.createElement('span');
      badge.className = 'video-badge';
      badge.textContent = '▶';
      a.appendChild(badge);
    }

    return a;
  }

  // Infinite scroll: the metadata fetch above still pulls every row (needed
  // for tab switching and sorting by likes/comments/views, and cheap even at
  // ~1000 rows), but building ~1000 DOM tiles up front was the actual cost —
  // this renders a batch at a time and only builds the next batch once a
  // sentinel near the bottom of the grid scrolls into view, same idea as a
  // feed that loads more as you go rather than a page you click through.
  const BATCH_SIZE = 60;
  let currentSorted = [];
  let renderedCount = 0;
  let sentinelObserver = null;

  function renderNextBatch() {
    grid.querySelector('.grid-sentinel')?.remove();
    sentinelObserver?.disconnect();

    const batch = currentSorted.slice(renderedCount, renderedCount + BATCH_SIZE);
    for (const item of batch) grid.appendChild(buildTile(item));
    renderedCount += batch.length;

    if (renderedCount < currentSorted.length) {
      const sentinel = document.createElement('div');
      sentinel.className = 'grid-sentinel';
      grid.appendChild(sentinel);
      sentinelObserver = new IntersectionObserver((entries) => {
        if (entries[0].isIntersecting) renderNextBatch();
      }, { rootMargin: '600px' });
      sentinelObserver.observe(sentinel);
    }
  }

  function renderGrid(items) {
    currentSorted = [...items].sort(SORTERS[document.getElementById('sort-select').value]);
    renderedCount = 0;
    grid.innerHTML = '';
    sentinelObserver?.disconnect();
    sentinelObserver = null;

    if (currentSorted.length === 0) {
      status.textContent = t(dict, 'gallery.empty');
      status.hidden = false;
      return;
    }
    status.hidden = true;
    renderNextBatch();
  }

  function currentItems() {
    const activeTab = document.querySelector('.gallery-tab[aria-current="page"]').dataset.tab;
    return activeTab === 'favorites' ? media.filter((m) => favoriteIds.has(m.id)) : media;
  }

  document.querySelectorAll('.gallery-tab').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.gallery-tab').forEach((b) => b.removeAttribute('aria-current'));
      btn.setAttribute('aria-current', 'page');
      renderGrid(currentItems());
    });
  });

  document.getElementById('sort-select').addEventListener('change', () => renderGrid(currentItems()));

  renderGrid(currentItems());

  // Coming back from a photo — scroll to where it actually was instead of
  // resetting to the top. No smooth-scroll animation; this should feel like
  // picking back up where you left off, not drawing attention to itself.
  // With batched rendering the target tile may not exist in the DOM yet, so
  // catch up synchronously (bypassing the scroll-triggered observer) before
  // scrolling to it.
  const scrollTo = new URLSearchParams(window.location.search).get('scrollTo');
  if (scrollTo) {
    const targetIndex = currentSorted.findIndex((m) => m.id === scrollTo);
    while (targetIndex >= renderedCount && renderedCount < currentSorted.length) {
      renderNextBatch();
    }
    grid.querySelector(`[data-media-id="${scrollTo}"]`)?.scrollIntoView({ block: 'center' });
  }
</script>
