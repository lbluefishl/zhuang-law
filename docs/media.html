<title>Photo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/viewer.css">

<nav class="site-nav">
  <a href="gallery.html" data-i18n="nav.gallery">River</a>
  <a href="timeline.html" data-i18n="nav.timeline">Current</a>
  <a href="board.html" data-i18n="nav.board">Well</a>
  <a href="reel.html" data-i18n="nav.reel">Stream</a>
  <span class="spacer"></span>
  <a href="cats.html" class="nav-secondary" data-i18n="nav.cats">Fiyero &amp; Satine</a>
  <a href="settings.html" class="nav-secondary" data-i18n="nav.settings">Settings</a>
  <button class="sign-out" data-sign-out data-i18n="nav.sign_out">Sign out</button>
</nav>

<main>
  <div class="viewer-stage" id="stage">
    <a class="viewer-back-link" id="back-link"></a>
    <!-- No "Loading…" text — with the sessionStorage fast path + R2
         preloading, this is now visible for such a short window that
         showing it just reads as a flash of its own. Stays hidden and
         empty unless something actually goes wrong (see the two
         status.hidden = false; spots below), in which case it's still
         exactly where an error message needs to show up. -->
    <p class="loading-state" id="status" hidden></p>
  </div>
</main>

<script>
  // Sets the back-link before the Supabase SDK below is even requested, let
  // alone loaded/executed — that blocking <script src> is real, measurable
  // time (the ~0.25s still visible after the last fix) sitting in front of
  // the module script's own otherwise-instant assignment. This has no
  // dependency on it: `from`/`id` come straight from the URL, so a plain
  // classic script running the moment the parser reaches this point can set
  // the real destination immediately, before that network fetch even
  // starts. The module script below still re-applies this (translated,
  // once dict loads) — redundant here, not wrong.
  (function () {
    var params = new URLSearchParams(location.search);
    var from = params.get('from') === 'timeline' ? 'timeline' : 'gallery';
    var mediaId = params.get('id');
    var link = document.getElementById('back-link');
    link.href = mediaId ? (from + '.html?scrollTo=' + mediaId) : (from + '.html');
    link.textContent = from === 'timeline' ? '← Current' : '← River';
  })();
</script>

<dialog id="comments-drawer">
  <div class="drawer-header">
    <h2 data-i18n="comments.heading">Comments</h2>
    <button class="drawer-close" type="button" id="drawer-close">✕</button>
  </div>
  <div class="drawer-body">
    <form class="comment-form" id="comment-form">
      <textarea id="comment-body" data-i18n-placeholder="comments.placeholder" placeholder="Add a comment…" required></textarea>
      <button type="submit" data-i18n="comments.post">Post</button>
    </form>
    <div id="comment-list"></div>
  </div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script>
<script type="module">
  import { supabaseClient, R2_PUBLIC_URL } from './js/supabase-client.js';
  import { requireAuth, initSignOutButtons } from './js/auth-guard.js';
  import { createActionBar } from './js/action-bar.js';
  import { createCommentThread } from './js/comment-thread.js';
  import { loadOrderedItems } from './js/media-nav.js';
  import { applyStoredLanguage, syncLanguageFromProfile, t } from './js/i18n.js';

  // href + an English-fallback textContent are already set — see the plain
  // inline <script> right after #back-link in the HTML above, which runs
  // immediately (no dependency on the Supabase SDK <script src> below even
  // finishing its download, let alone requireAuth/syncLanguageFromProfile/
  // the dictionary fetch this module script itself still has ahead of it).
  // Recomputed here anyway since `from` is needed below regardless.
  // `mediaId` becomes `let` -- Prev/Next now update it in place (see
  // renderItem below) instead of triggering a real navigation.
  const params = new URLSearchParams(window.location.search);
  let mediaId = params.get('id');
  const from = params.get('from') === 'timeline' ? 'timeline' : 'gallery';
  const backLink = document.getElementById('back-link');

  const session = await requireAuth();
  initSignOutButtons();
  const myId = session.user.id;
  await syncLanguageFromProfile(supabaseClient, myId);
  const dict = await applyStoredLanguage();

  // Only gates whether the delete button renders — the real enforcement is
  // RLS (media_write requires is_admin() at the database level), same as
  // the admin comments dashboard.
  const { data: myProfile } = await supabaseClient.from('profiles').select('is_admin').eq('id', myId).single();
  const isAdmin = !!myProfile?.is_admin;

  const stage = document.getElementById('stage');
  const status = document.getElementById('status');
  const drawer = document.getElementById('comments-drawer');

  document.getElementById('drawer-close').addEventListener('click', () => drawer.close());

  // Re-applies the real translation now that dict is actually loaded — a
  // same-language no-op for English visitors (already showing the right
  // string above), a quick correction from the English fallback to the
  // right zh/yue text for everyone else. Either way, it can never show the
  // wrong DESTINATION the way the old flash could.
  backLink.textContent = from === 'timeline' ? t(dict, 'media.back_timeline') : t(dict, 'media.back_gallery');

  if (!mediaId) {
    status.hidden = false;
    status.textContent = t(dict, 'media.error_no_id');
  } else {
    // --- Prev/Next used to be a real <a href="media.html?id=...">, i.e. a
    // full page navigation, every time. The image/video bytes for the
    // neighbor were already preloaded, but everything ELSE still had to
    // happen from scratch first: re-check the session, re-fetch the
    // language dictionary, re-query is_admin, rebuild the action bar (3
    // queries), refresh the comments drawer -- all before the page even
    // tried to show the (already-cached) file, on top of the blank-white
    // flash a full navigation causes regardless. None of that actually
    // changes between photos in the same browsing session.
    //
    // renderItem() below swaps the DOM in place instead, using
    // history.pushState so the URL/back-button still behave like real
    // navigation. It reuses whichever neighbor element was already
    // preloaded (created once, kept warm, never re-fetched), so the swap
    // itself costs nothing but a style reset. Only the genuinely per-item
    // state (action bar reactions, comment thread) still needs a fresh
    // query -- everything upstream of this block runs exactly once per
    // page load, no matter how many photos get browsed afterward.
    let currentMediaEl = null; // the visible <img>/<video>
    let currentActionBar = null;
    let orderedItems = null; // full list, once loadOrderedItems resolves
    let prevId, nextId; // kept live so the swipe handler (attached once) always sees the current neighbors
    const preloadedEls = new Map(); // id -> hidden, already-loading <img>/<video>, always exactly {prevId, nextId}

    const conn = navigator.connection;
    const skipPrefetch = conn && (conn.saveData || ['slow-2g', '2g'].includes(conn.effectiveType));

    function buildImg(item) {
      const img = new Image();
      img.src = `${R2_PUBLIC_URL}/${item.r2_key}`;
      img.alt = '';
      return img;
    }
    function buildVideo(item) {
      const video = document.createElement('video');
      video.src = `${R2_PUBLIC_URL}/${item.r2_key}`;
      video.poster = `${R2_PUBLIC_URL}/${item.thumb_key}`;
      video.controls = true;
      video.playsInline = true;
      return video;
    }

    // TikTok-style: warm the browser's cache for whichever item(s) are one
    // tap/swipe away, so Prev/Next feels closer to instant instead of
    // starting a multi-MB download from a standing start.
    //
    // This used <link rel="prefetch"> before — dropped it. Safari (iOS AND
    // macOS) has never implemented rel=prefetch at all, silently no-opping
    // it; for a family site where a lot of relatives are on iPhones, that
    // meant a real fraction of visitors got zero preloading despite the
    // code running. Even where it IS supported, browsers treat it as their
    // lowest, most-skippable priority. Actually requesting the resource --
    // `new Image()` for photos, a real (hidden) <video preload="auto"> for
    // videos -- works in every browser and can't be silently ignored the
    // way a hint can. Kept in `preloadedEls` (keyed by id) so nothing gets
    // garbage collected mid-request, AND so a later renderItem() call can
    // just reuse the exact element instead of starting a new fetch.
    function ensurePreloaded(item) {
      if (!item || skipPrefetch || preloadedEls.has(item.id)) return;
      const url = `${R2_PUBLIC_URL}/${item.r2_key}`;
      let el;
      if (item.media_type === 'video') {
        el = document.createElement('video');
        el.preload = 'auto';
        el.muted = true;
        el.playsInline = true;
        el.src = url;
        // Not display:none — some browsers skip loading elements that are
        // never actually rendered at all. This renders a 1x1 invisible box
        // instead, which reliably still loads.
        el.style.cssText = 'position:absolute; width:1px; height:1px; opacity:0; pointer-events:none;';
        document.body.appendChild(el);
      } else {
        el = new Image();
        // Real, supported priority signal (Chrome/Edge honor it,
        // Firefox/Safari just ignore it and fetch normally either way) --
        // keeps this from competing with the current item's own, more
        // urgent load.
        el.fetchPriority = 'low';
        el.src = url;
      }
      preloadedEls.set(item.id, el);
    }

    // A preloaded neighbor becoming the visible item — reset it from its
    // hidden 1x1 preload state to how the "current" element normally looks.
    function promote(el, item) {
      if (el.tagName === 'VIDEO') {
        el.style.cssText = '';
        el.controls = true;
        el.muted = false;
        el.poster = `${R2_PUBLIC_URL}/${item.thumb_key}`;
      } else {
        el.alt = '';
      }
      return el;
    }

    // The outgoing visible item becoming a background neighbor again (it's
    // very likely about to BE one — moving forward from A to B makes A the
    // new prevId) — park it back into the hidden 1x1 preload state rather
    // than discarding it, so stepping back is just as instant as stepping
    // forward was.
    function demote(el) {
      if (el.tagName === 'VIDEO') {
        el.pause(); // stop audio immediately, before it's hidden
        el.muted = true;
        el.controls = false;
      }
      el.style.cssText = 'position:absolute; width:1px; height:1px; opacity:0; pointer-events:none;';
      document.body.appendChild(el);
      return el;
    }

    function buildNavLink(prevOrNext, targetId) {
      const a = document.createElement('a');
      a.className = prevOrNext === 'prev' ? 'viewer-prev-link' : 'viewer-next-link';
      a.href = `media.html?id=${targetId}&from=${from}`; // real href kept for right-click/open-in-new-tab/no-JS
      a.textContent = t(dict, prevOrNext === 'prev' ? 'media.prev' : 'media.next');
      a.addEventListener('click', (e) => {
        e.preventDefault();
        renderItem(targetId, { pushState: true });
      });
      return a;
    }

    // Recomputes prevId/nextId for whatever `mediaId` currently is, rebuilds
    // the Prev/Next buttons, and slides the preload window to match — always
    // exactly the two immediate neighbors, freeing anything further away.
    function updateNeighbors() {
      const idx = orderedItems.findIndex((m) => m.id === mediaId);
      const prevItem = idx > 0 ? orderedItems[idx - 1] : undefined;
      const nextItem = idx !== -1 ? orderedItems[idx + 1] : undefined;
      prevId = prevItem?.id;
      nextId = nextItem?.id;

      navGroup.innerHTML = '';
      if (prevId) navGroup.appendChild(buildNavLink('prev', prevId));
      if (nextId) navGroup.appendChild(buildNavLink('next', nextId));

      ensurePreloaded(prevItem);
      ensurePreloaded(nextItem);

      const keep = new Set([prevId, nextId].filter(Boolean));
      for (const [id, el] of preloadedEls) {
        if (keep.has(id)) continue;
        if (el.tagName === 'VIDEO') el.pause();
        el.remove();
        preloadedEls.delete(id);
      }
    }

    // The single place a Prev/Next hop (click, swipe, or browser
    // back/forward) goes through — resolves the target row, swaps the
    // visible element (reusing a preloaded one when there is one), updates
    // everything else that's actually per-item (view count, action bar,
    // comments), and leaves auth/language/admin untouched since none of it
    // depends on which photo is showing.
    async function renderItem(id, { pushState, knownItem } = {}) {
      let item = knownItem || orderedItems?.find((m) => m.id === id);
      if (!item) {
        const { data, error } = await supabaseClient
          .from('media')
          .select('r2_key, thumb_key, media_type, date_taken')
          .eq('id', id)
          .single();
        if (error || !data) {
          status.hidden = false;
          status.textContent = t(dict, 'media.error_not_found');
          return;
        }
        item = data;
      }
      status.remove?.(); // no-op once already removed — harmless to call again on every hop

      const previousId = mediaId;
      const previousEl = currentMediaEl;

      mediaId = id;
      if (pushState) history.pushState(null, '', `media.html?id=${id}&from=${from}`);

      backLink.href = `${from}.html?scrollTo=${id}`;

      let el = preloadedEls.get(id);
      if (el) {
        preloadedEls.delete(id);
        promote(el, item);
      } else {
        el = item.media_type === 'video' ? buildVideo(item) : buildImg(item);
      }
      stage.appendChild(el);
      currentMediaEl = el;

      if (previousEl && previousEl !== el) {
        previousEl.remove();
        preloadedEls.set(previousId, demote(previousEl));
      }

      metaEl.textContent = new Date(item.date_taken).toLocaleDateString(undefined, {
        year: 'numeric', month: 'long', day: 'numeric',
      });

      // Fire-and-forget — a real open of the detail page counts as a view,
      // not just the thumbnail appearing in a grid. Doesn't block rendering.
      // supabase-js's query builder is a LAZY thenable, not a real Promise —
      // it only implements .then(), not .catch()/.finally(), and the actual
      // request is never sent until something calls .then() on it (or it's
      // awaited). Calling .catch() here threw a *synchronous* TypeError
      // ("...catch is not a function") that silently killed the rest of this
      // script — including the image/video that was supposed to render —
      // since it's not inside a try/catch. .then()'s two-argument form is
      // the correct way to fire-and-forget one of these.
      supabaseClient.rpc('increment_view_count', { target_media_id: id }).then(() => {}, () => {});

      if (orderedItems) updateNeighbors();

      // Per-item reaction/comment-count state — genuinely can't be known
      // ahead of time the way the file bytes can, so this still costs a
      // real round trip on every hop. Everything upstream of this function
      // no longer does.
      currentActionBar?.element.remove();
      currentActionBar = await createActionBar({
        supabaseClient, mediaId: id, userId: myId,
        onOpenComments: () => drawer.showModal(),
        isAdmin, dict, t,
        // The item is gone — nothing left on this page to show. backLink
        // already points at the right destination (Gallery/Timeline,
        // whichever this was actually opened from).
        onDeleted: () => { window.location.href = backLink.href; },
      });
      stage.appendChild(currentActionBar.element);

      await thread.refresh();
    }

    // Created once — getMediaId/onCountChange read live state (mediaId,
    // currentActionBar) rather than being bound to whichever item was
    // current when this was constructed, so the same thread instance keeps
    // working correctly across every renderItem() call.
    const thread = createCommentThread({
      supabaseClient,
      listEl: document.getElementById('comment-list'),
      formEl: document.getElementById('comment-form'),
      bodyInputEl: document.getElementById('comment-body'),
      myId,
      getMediaId: () => mediaId,
      onCountChange: (count) => currentActionBar?.setCommentCount(count),
      dict, t,
    });

    const metaEl = document.createElement('p');
    metaEl.className = 'viewer-meta';
    stage.appendChild(metaEl);

    const navGroup = document.createElement('div');
    navGroup.className = 'viewer-nav-group';
    stage.appendChild(navGroup);

    // Swipe left -> next, swipe right -> previous. Attached once; reads
    // prevId/nextId live so it always targets whatever's actually adjacent,
    // not whatever was adjacent when the page first loaded.
    let touchStartX = null;
    stage.addEventListener('touchstart', (e) => { touchStartX = e.touches[0].clientX; }, { passive: true });
    stage.addEventListener('touchend', (e) => {
      if (touchStartX === null) return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      const SWIPE_THRESHOLD = 50;
      if (dx < -SWIPE_THRESHOLD && nextId) renderItem(nextId, { pushState: true });
      else if (dx > SWIPE_THRESHOLD && prevId) renderItem(prevId, { pushState: true });
      touchStartX = null;
    });

    // Browser back/forward across a Prev/Next hop that used pushState —
    // render in place instead of falling through to a real reload.
    window.addEventListener('popstate', () => {
      const id = new URLSearchParams(window.location.search).get('id');
      if (id && id !== mediaId) renderItem(id, { pushState: false });
    });

    // Kicked off immediately, before the render below — this used to block
    // the image/video AND the action bar AND comments behind it, which made
    // Prev/Next visibly lag in. Once it resolves, refresh the cache the
    // fast-path lookup below reads from (so the next hop, or a hop back to
    // this same item, can skip its own row query too) and wire up the
    // actual neighbor buttons/preloading/swipe targets against whatever
    // item is CURRENT by then — which may not be the page's original one,
    // if the visitor already clicked Prev/Next again before this resolved.
    const orderedItemsPromise = loadOrderedItems(supabaseClient, from).catch(() => []);

    // A Prev/Next hop's target was already IN the ordered list the previous
    // page fetched (loadOrderedItems selects every field this page renders
    // with, not just id/r2_key) — stashed in sessionStorage so the very
    // first render on a fresh page load can use it directly instead of
    // waiting on a fresh query for a row it effectively already had. Falls
    // through to a fresh query on a cache miss (direct link, first visit
    // this tab, a different `from` than what's cached, or storage blocked).
    let fastPathItem = null;
    try {
      const cached = JSON.parse(sessionStorage.getItem(`zl_media_order:${from}`) || 'null');
      fastPathItem = cached?.find((m) => m.id === mediaId) || null;
    } catch { /* corrupt/blocked storage — renderItem's own fallback query covers this */ }

    await renderItem(mediaId, { pushState: false, knownItem: fastPathItem || undefined });

    orderedItemsPromise.then((items) => {
      orderedItems = items;
      try {
        sessionStorage.setItem(`zl_media_order:${from}`, JSON.stringify(items));
      } catch { /* storage blocked/full — preload/nav still work, just no fast path next time */ }
      updateNeighbors();
    });
  }
</script>
