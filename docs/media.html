<title>Photo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/viewer.css">

<nav class="site-nav">
  <a href="gallery.html" data-i18n="nav.gallery">Gallery</a>
  <a href="timeline.html" data-i18n="nav.timeline">Timeline</a>
  <a href="board.html" data-i18n="nav.board">Card</a>
  <a href="reel.html" data-i18n="nav.reel">Reel</a>
  <a href="cats.html" data-i18n="nav.cats">Fiyero &amp; Satine</a>
  <span class="spacer"></span>
  <a href="settings.html" class="nav-secondary" data-i18n="nav.settings">Settings</a>
  <button class="sign-out" data-sign-out data-i18n="nav.sign_out">Sign out</button>
</nav>

<main>
  <div class="viewer-stage" id="stage">
    <a class="viewer-back-link" id="back-link"></a>
    <!-- No "Loading…" text — with the sessionStorage fast path + R2
         preloading, this is now visible for such a short window that
         showing it just reads as a flash of its own. Stays hidden and
         empty unless something actually goes wrong (see the two
         status.hidden = false; spots below), in which case it's still
         exactly where an error message needs to show up. -->
    <p class="loading-state" id="status" hidden></p>
  </div>
</main>

<script>
  // Sets the back-link before the Supabase SDK below is even requested, let
  // alone loaded/executed — that blocking <script src> is real, measurable
  // time (the ~0.25s still visible after the last fix) sitting in front of
  // the module script's own otherwise-instant assignment. This has no
  // dependency on it: `from`/`id` come straight from the URL, so a plain
  // classic script running the moment the parser reaches this point can set
  // the real destination immediately, before that network fetch even
  // starts. The module script below still re-applies this (translated,
  // once dict loads) — redundant here, not wrong.
  (function () {
    var params = new URLSearchParams(location.search);
    var from = params.get('from') === 'timeline' ? 'timeline' : 'gallery';
    var mediaId = params.get('id');
    var link = document.getElementById('back-link');
    link.href = mediaId ? (from + '.html?scrollTo=' + mediaId) : (from + '.html');
    link.textContent = from === 'timeline' ? '← Timeline' : '← Gallery';
  })();
</script>

<dialog id="comments-drawer">
  <div class="drawer-header">
    <h2 data-i18n="comments.heading">Comments</h2>
    <button class="drawer-close" type="button" id="drawer-close">✕</button>
  </div>
  <div class="drawer-body">
    <form class="comment-form" id="comment-form">
      <textarea id="comment-body" data-i18n-placeholder="comments.placeholder" placeholder="Add a comment…" required></textarea>
      <button type="submit" data-i18n="comments.post">Post</button>
    </form>
    <div id="comment-list"></div>
  </div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script>
<script type="module">
  import { supabaseClient, R2_PUBLIC_URL } from './js/supabase-client.js';
  import { requireAuth, initSignOutButtons } from './js/auth-guard.js';
  import { createActionBar } from './js/action-bar.js';
  import { createCommentThread } from './js/comment-thread.js';
  import { loadOrderedItems } from './js/media-nav.js';
  import { applyStoredLanguage, syncLanguageFromProfile, t } from './js/i18n.js';

  // href + an English-fallback textContent are already set — see the plain
  // inline <script> right after #back-link in the HTML above, which runs
  // immediately (no dependency on the Supabase SDK <script src> below even
  // finishing its download, let alone requireAuth/syncLanguageFromProfile/
  // the dictionary fetch this module script itself still has ahead of it).
  // Recomputed here anyway since `from`/`mediaId` are needed below regardless.
  const params = new URLSearchParams(window.location.search);
  const mediaId = params.get('id');
  const from = params.get('from') === 'timeline' ? 'timeline' : 'gallery';
  const backLink = document.getElementById('back-link');

  const session = await requireAuth();
  initSignOutButtons();
  const myId = session.user.id;
  await syncLanguageFromProfile(supabaseClient, myId);
  const dict = await applyStoredLanguage();

  // Only gates whether the delete button renders — the real enforcement is
  // RLS (media_write requires is_admin() at the database level), same as
  // the admin comments dashboard.
  const { data: myProfile } = await supabaseClient.from('profiles').select('is_admin').eq('id', myId).single();
  const isAdmin = !!myProfile?.is_admin;

  const stage = document.getElementById('stage');
  const status = document.getElementById('status');
  const drawer = document.getElementById('comments-drawer');

  document.getElementById('drawer-close').addEventListener('click', () => drawer.close());

  // Re-applies the real translation now that dict is actually loaded — a
  // same-language no-op for English visitors (already showing the right
  // string above), a quick correction from the English fallback to the
  // right zh/yue text for everyone else. Either way, it can never show the
  // wrong DESTINATION the way the old flash could.
  backLink.textContent = from === 'timeline' ? t(dict, 'media.back_timeline') : t(dict, 'media.back_gallery');

  if (!mediaId) {
    status.hidden = false;
    status.textContent = t(dict, 'media.error_no_id');
  } else {
    // Kicked off immediately, in parallel with everything else below — this
    // used to run only after the image, action bar, AND comments had all
    // finished loading, which made Prev/Next visibly lag in.
    const orderedItemsPromise = loadOrderedItems(supabaseClient, from).catch(() => []);

    // A Prev/Next hop's target was already IN the ordered list the
    // previous page fetched (loadOrderedItems now selects every field this
    // page renders with, not just id/r2_key) — stashed in sessionStorage so
    // this page can use it directly instead of re-querying Supabase for a
    // row it effectively already had. This is what was actually behind
    // "still shows a loading screen even with prefetching" — the R2 file
    // bytes being warm never mattered if the page was still waiting on this
    // query before it would even try to display them. Falls through to a
    // fresh query on a cache miss (direct link, first visit this tab, a
    // different `from` than what's cached, or storage blocked).
    let item = null;
    try {
      const cached = JSON.parse(sessionStorage.getItem(`zl_media_order:${from}`) || 'null');
      item = cached?.find((m) => m.id === mediaId) || null;
    } catch { /* corrupt/blocked storage — just fall through to the query */ }

    if (!item) {
      const { data, error } = await supabaseClient
        .from('media')
        .select('r2_key, thumb_key, media_type, date_taken')
        .eq('id', mediaId)
        .single();
      if (error || !data) {
        status.hidden = false;
        status.textContent = t(dict, 'media.error_not_found');
      } else {
        item = data;
      }
    }

    if (item) {
      status.remove();

      // Fire-and-forget — a real open of the detail page counts as a view,
      // not just the thumbnail appearing in a grid. Doesn't block rendering.
      // supabase-js's query builder is a LAZY thenable, not a real Promise —
      // it only implements .then(), not .catch()/.finally(), and the actual
      // request is never sent until something calls .then() on it (or it's
      // awaited). Calling .catch() here threw a *synchronous* TypeError
      // ("...catch is not a function") that silently killed the rest of this
      // script — including the image/video that was supposed to render —
      // since it's not inside a try/catch. .then()'s two-argument form is
      // the correct way to fire-and-forget one of these.
      supabaseClient.rpc('increment_view_count', { target_media_id: mediaId }).then(() => {}, () => {});

      if (item.media_type === 'video') {
        const video = document.createElement('video');
        video.src = `${R2_PUBLIC_URL}/${item.r2_key}`;
        video.poster = `${R2_PUBLIC_URL}/${item.thumb_key}`;
        video.controls = true;
        video.playsInline = true;
        stage.appendChild(video);
      } else {
        const img = document.createElement('img');
        img.src = `${R2_PUBLIC_URL}/${item.r2_key}`;
        img.alt = '';
        stage.appendChild(img);
      }

      const meta = document.createElement('p');
      meta.className = 'viewer-meta';
      meta.textContent = new Date(item.date_taken).toLocaleDateString(undefined, {
        year: 'numeric', month: 'long', day: 'numeric',
      });
      stage.appendChild(meta);

      // Prev/Next buttons (pointer devices only — CSS hides them under
      // touch, see viewer.css) and swipe navigation (touch devices — the
      // buttons wouldn't be reachable there anyway, and swiping is the
      // expected gesture) both come from the same ordered-list lookup.
      // Doesn't wait on the action bar or comments below it.
      orderedItemsPromise.then((orderedItems) => {
        // Refreshes the cache the fast-path lookup above reads from, so the
        // *next* hop (or a hop from this same item in the other direction)
        // can skip its own row query too. Written here unconditionally,
        // whether or not this load itself hit the cache.
        try {
          sessionStorage.setItem(`zl_media_order:${from}`, JSON.stringify(orderedItems));
        } catch { /* storage blocked/full — preload/nav still work, just no fast path next time */ }

        const currentIndex = orderedItems.findIndex((m) => m.id === mediaId);
        const prevItem = currentIndex > 0 ? orderedItems[currentIndex - 1] : undefined;
        const nextItem = currentIndex !== -1 ? orderedItems[currentIndex + 1] : undefined;
        const prevId = prevItem?.id;
        const nextId = nextItem?.id;

        // TikTok-style: warm the browser's cache for whichever item(s) are
        // one tap/swipe away, so Prev/Next feels closer to instant instead
        // of starting a multi-MB download from a standing start.
        //
        // This used <link rel="prefetch"> before — dropped it. Safari (iOS
        // AND macOS) has never implemented rel=prefetch at all, silently
        // no-opping it; for a family site where a lot of relatives are on
        // iPhones, that meant a real fraction of visitors got zero
        // preloading despite the code running. Even where it IS supported,
        // browsers treat it as their lowest, most-skippable priority.
        // Actually requesting the resource — `new Image()` for photos, a
        // real (hidden) <video preload="auto"> for videos — works in every
        // browser and can't be silently ignored the way a hint can.
        // References are kept in `preloaded` so nothing here gets garbage
        // collected mid-request.
        const conn = navigator.connection;
        const skipPrefetch = conn && (conn.saveData || ['slow-2g', '2g'].includes(conn.effectiveType));
        const preloaded = [];
        if (!skipPrefetch) {
          for (const neighbor of [nextItem, prevItem]) {
            if (!neighbor) continue;
            const url = `${R2_PUBLIC_URL}/${neighbor.r2_key}`;
            if (neighbor.media_type === 'video') {
              const video = document.createElement('video');
              video.preload = 'auto';
              video.muted = true;
              video.src = url;
              // Not display:none — some browsers skip loading elements
              // that are never actually rendered at all. This renders a
              // 1x1 invisible box instead, which reliably still loads.
              video.style.cssText = 'position:absolute; width:1px; height:1px; opacity:0; pointer-events:none;';
              document.body.appendChild(video);
              preloaded.push(video);
            } else {
              const img = new Image();
              // Real, supported priority signal (Chrome/Edge honor it,
              // Firefox/Safari just ignore it and fetch normally either
              // way) — keeps this from competing with the current item's
              // own, more urgent load.
              img.fetchPriority = 'low';
              img.src = url;
              preloaded.push(img);
            }
          }
        }

        const navGroup = document.createElement('div');
        navGroup.className = 'viewer-nav-group';
        if (prevId) {
          const prevLink = document.createElement('a');
          prevLink.className = 'viewer-prev-link';
          prevLink.href = `media.html?id=${prevId}&from=${from}`;
          prevLink.textContent = t(dict, 'media.prev');
          navGroup.appendChild(prevLink);
        }
        if (nextId) {
          const nextLink = document.createElement('a');
          nextLink.className = 'viewer-next-link';
          nextLink.href = `media.html?id=${nextId}&from=${from}`;
          nextLink.textContent = t(dict, 'media.next');
          navGroup.appendChild(nextLink);
        }
        stage.appendChild(navGroup);

        // Swipe left -> next, swipe right -> previous.
        let touchStartX = null;
        stage.addEventListener('touchstart', (e) => { touchStartX = e.touches[0].clientX; }, { passive: true });
        stage.addEventListener('touchend', (e) => {
          if (touchStartX === null) return;
          const dx = e.changedTouches[0].clientX - touchStartX;
          const SWIPE_THRESHOLD = 50;
          if (dx < -SWIPE_THRESHOLD && nextId) window.location.href = `media.html?id=${nextId}&from=${from}`;
          else if (dx > SWIPE_THRESHOLD && prevId) window.location.href = `media.html?id=${prevId}&from=${from}`;
          touchStartX = null;
        });
      });

      const actionBar = await createActionBar({
        supabaseClient, mediaId, userId: myId,
        onOpenComments: () => drawer.showModal(),
        isAdmin, dict, t,
        // The item is gone — nothing left on this page to show. backLink
        // already points at the right destination (Gallery or Timeline,
        // whichever this was actually opened from).
        onDeleted: () => { window.location.href = backLink.href; },
      });
      stage.appendChild(actionBar.element);

      const thread = createCommentThread({
        supabaseClient,
        listEl: document.getElementById('comment-list'),
        formEl: document.getElementById('comment-form'),
        bodyInputEl: document.getElementById('comment-body'),
        myId,
        getMediaId: () => mediaId,
        onCountChange: actionBar.setCommentCount,
        dict, t,
      });

      await thread.refresh();
    }
  }
</script>
