<title>Ashley's Birthday Board</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Pacifico&family=Quicksand:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/board.css">

<nav class="site-nav">
  <a href="gallery.html" data-i18n="nav.gallery">Gallery</a>
  <a href="timeline.html" data-i18n="nav.timeline">Timeline</a>
  <a href="board.html" aria-current="page" data-i18n="nav.board">Board</a>
  <a href="reel.html" data-i18n="nav.reel">Reel</a>
  <a href="cats.html" data-i18n="nav.cats">Fiyero &amp; Satine</a>
  <span class="spacer"></span>
  <a href="settings.html" class="nav-secondary" data-i18n="nav.settings">Settings</a>
  <button class="sign-out" data-sign-out data-i18n="nav.sign_out">Sign out</button>
</nav>

<main class="board-page">
  <p class="loading-state" id="status" data-i18n="board.loading">Loading…</p>
  <header class="board-header" id="board-header" hidden>
    <h1 id="board-title"></h1>
    <p id="board-subtitle"></p>
  </header>

  <div class="board-grid" id="board-grid" hidden></div>
</main>

<dialog id="compose-dialog">
  <form id="compose-form">
    <h2 id="dialog-heading" data-i18n="board.compose_heading_add">Add your message</h2>

    <label for="message-body" data-i18n="board.message_label">Message</label>
    <textarea id="message-body" required></textarea>
    <p class="field-hint" id="char-count"></p>

    <label data-i18n="board.font_label">Font</label>
    <div class="swatch-row" id="font-row"></div>

    <label data-i18n="board.color_label">Color</label>
    <div class="swatch-row" id="color-row"></div>

    <label data-i18n="board.border_label">Border</label>
    <div class="swatch-row" id="border-row"></div>

    <label data-i18n="board.sticker_label">Sticker (optional)</label>
    <div class="swatch-row" id="decoration-row"></div>

    <label data-i18n="board.preview_label">Preview</label>
    <div id="note-preview-wrap"></div>

    <p class="error-message" id="compose-error"></p>

    <div class="dialog-actions">
      <button type="button" id="remove-btn" class="danger-link" hidden data-i18n="board.remove_btn">Remove my message</button>
      <span class="spacer"></span>
      <button type="button" id="cancel-btn" data-i18n="board.cancel_btn">Cancel</button>
      <button type="submit" data-i18n="board.save_btn">Save</button>
    </div>
  </form>
</dialog>

<dialog id="view-dialog">
  <div id="view-note-wrap"></div>
  <div class="dialog-actions">
    <span class="spacer"></span>
    <button type="button" id="view-close-btn" data-i18n="board.close_btn">Close</button>
  </div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script>
<script type="module">
  import { supabaseClient } from './js/supabase-client.js';
  import { requireAuth, initSignOutButtons } from './js/auth-guard.js';
  import {
    FONTS, COLORS, BORDERS, DECORATIONS, MAX_MESSAGE_LENGTH,
    loadBoard, loadMessages, upsertMyMessage, deleteMyMessage,
  } from './js/board.js';
  import { applyStoredLanguage, syncLanguageFromProfile, t } from './js/i18n.js';

  const BOARD_SLUG = 'ashley-birthday-2026';

  const session = await requireAuth();
  initSignOutButtons();
  const myId = session.user.id;
  await syncLanguageFromProfile(supabaseClient, session.user.id);
  const dict = await applyStoredLanguage();

  // FONTS/BORDERS labels come from board.js as plain English keys/labels —
  // translated here (not in board.js, which stays presentation-agnostic) via
  // this lookup, indexed the same way as the dict's own keys.
  const FONT_LABEL_KEYS = { default: 'font_default', handwriting: 'font_handwriting', script: 'font_script', rounded: 'font_rounded' };
  const BORDER_LABEL_KEYS = { none: 'border_none', solid: 'border_solid', dashed: 'border_dashed', tape: 'border_tape' };

  const status = document.getElementById('status');
  const header = document.getElementById('board-header');
  const grid = document.getElementById('board-grid');
  const dialog = document.getElementById('compose-dialog');
  const composeForm = document.getElementById('compose-form');
  const viewDialog = document.getElementById('view-dialog');

  document.getElementById('message-body').maxLength = MAX_MESSAGE_LENGTH;

  let board, messages, myMessage;

  function noteStyle(font, colorKey, borderStyle) {
    const bg = COLORS[colorKey] || COLORS.yellow;
    return {
      fontFamily: FONTS[font]?.family || 'inherit',
      background: bg,
      borderStyle: borderStyle === 'tape' ? 'none' : (borderStyle === 'none' ? 'none' : borderStyle),
    };
  }

  function renderNote(container, msg, { mine, expanded = false }) {
    const note = document.createElement('div');
    note.className = `note note-border-${msg.border_style}`;
    const style = noteStyle(msg.font, msg.note_color, msg.border_style);
    note.style.fontFamily = style.fontFamily;
    note.style.background = style.background;
    if (msg.border_style !== 'none' && msg.border_style !== 'tape') note.style.borderStyle = style.borderStyle;

    if (msg.decoration) {
      const deco = document.createElement('span');
      deco.className = 'note-decoration';
      deco.textContent = msg.decoration;
      note.appendChild(deco);
    }
    if (msg.border_style === 'tape') {
      const tape = document.createElement('span');
      tape.className = 'note-tape';
      note.appendChild(tape);
    }

    const body = document.createElement('p');
    // At the 1000-char length, most messages won't fully fit in the grid
    // card — expanded (used inside view-dialog) drops the line-clamp so the
    // full text shows there instead. msg.body itself is exactly what the
    // person typed — never run through translation (see feedback: board
    // messages keep whatever language they were written in).
    body.className = expanded ? 'note-body note-body-expanded' : 'note-body';
    body.textContent = msg.body;
    note.appendChild(body);

    const sig = document.createElement('p');
    sig.className = 'note-signature';
    sig.textContent = `— ${msg.profiles?.display_name ?? t(dict, 'board.signature_someone')}`;
    note.appendChild(sig);

    if (mine) {
      note.classList.add('note-mine');
      note.title = t(dict, 'board.tap_to_edit');
      note.addEventListener('click', () => openCompose(msg.slot_index, msg));
    } else if (msg.id && !expanded) {
      // msg.id distinguishes a real board row from the live preview stub
      // rendered inside the compose dialog (which has no id).
      note.classList.add('note-viewable');
      note.title = t(dict, 'board.tap_to_read');
      note.addEventListener('click', () => openView(msg));
    }
    container.appendChild(note);
  }

  function openView(msg) {
    const wrap = document.getElementById('view-note-wrap');
    wrap.innerHTML = '';
    renderNote(wrap, msg, { mine: false, expanded: true });
    viewDialog.showModal();
  }

  document.getElementById('view-close-btn').addEventListener('click', () => viewDialog.close());

  async function render() {
    board = await loadBoard(supabaseClient, BOARD_SLUG);
    messages = await loadMessages(supabaseClient, board.id);
    myMessage = messages.find((m) => m.user_id === myId) || null;

    // board.title / board.subtitle are admin-authored content in the boards
    // table (like a comment or a board message), not app chrome — no
    // per-language columns for them yet, so they render as entered.
    document.getElementById('board-title').textContent = board.title;
    document.getElementById('board-subtitle').textContent = board.subtitle || '';
    header.hidden = false;
    status.remove?.();
    grid.hidden = false;
    grid.innerHTML = '';

    const bySlot = new Map(messages.map((m) => [m.slot_index, m]));
    for (let i = 0; i < board.slot_count; i++) {
      const slotEl = document.createElement('div');
      slotEl.className = 'board-slot';
      const msg = bySlot.get(i);
      if (msg) {
        renderNote(slotEl, msg, { mine: msg.user_id === myId });
      } else if (!myMessage) {
        const empty = document.createElement('button');
        empty.type = 'button';
        empty.className = 'board-slot-empty';
        empty.textContent = '+';
        empty.setAttribute('aria-label', t(dict, 'board.add_placeholder_label'));
        empty.addEventListener('click', () => openCompose(i, null));
        slotEl.appendChild(empty);
      }
      grid.appendChild(slotEl);
    }
  }

  // --- Compose dialog ---
  let composeSlot = null;
  let composeState = { font: 'default', color: 'yellow', border: 'solid', decoration: '' };

  function buildSwatchRow(rowEl, options, currentKey, render, onPick) {
    rowEl.innerHTML = '';
    for (const key of options) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'swatch';
      if (key === currentKey) btn.classList.add('swatch-selected');
      render(btn, key);
      btn.addEventListener('click', () => {
        rowEl.querySelectorAll('.swatch').forEach((b) => b.classList.remove('swatch-selected'));
        btn.classList.add('swatch-selected');
        onPick(key);
        updatePreview();
      });
      rowEl.appendChild(btn);
    }
  }

  function updatePreview() {
    const wrap = document.getElementById('note-preview-wrap');
    wrap.innerHTML = '';
    renderNote(wrap, {
      body: document.getElementById('message-body').value || t(dict, 'board.preview_placeholder'),
      font: composeState.font,
      note_color: composeState.color,
      border_style: composeState.border,
      decoration: composeState.decoration,
      profiles: { display_name: 'You' },
      user_id: null,
    }, { mine: false });
  }

  function openCompose(slotIndex, existing) {
    composeSlot = slotIndex;
    composeState = existing
      ? { font: existing.font, color: existing.note_color, border: existing.border_style, decoration: existing.decoration || '' }
      : { font: 'default', color: 'yellow', border: 'solid', decoration: '' };

    document.getElementById('dialog-heading').textContent = existing
      ? t(dict, 'board.compose_heading_edit')
      : t(dict, 'board.compose_heading_add');
    document.getElementById('message-body').value = existing?.body || '';
    document.getElementById('char-count').textContent = `${(existing?.body || '').length} / ${MAX_MESSAGE_LENGTH}`;
    document.getElementById('remove-btn').hidden = !existing;
    document.getElementById('compose-error').textContent = '';

    buildSwatchRow(document.getElementById('font-row'), Object.keys(FONTS), composeState.font, (btn, key) => {
      btn.textContent = t(dict, `board.${FONT_LABEL_KEYS[key]}`);
      btn.style.fontFamily = FONTS[key].family;
    }, (key) => { composeState.font = key; });

    buildSwatchRow(document.getElementById('color-row'), Object.keys(COLORS), composeState.color, (btn, key) => {
      btn.style.background = COLORS[key];
    }, (key) => { composeState.color = key; });

    buildSwatchRow(document.getElementById('border-row'), BORDERS, composeState.border, (btn, key) => {
      btn.textContent = t(dict, `board.${BORDER_LABEL_KEYS[key]}`);
    }, (key) => { composeState.border = key; });

    buildSwatchRow(document.getElementById('decoration-row'), DECORATIONS, composeState.decoration, (btn, key) => {
      btn.textContent = key || '—';
    }, (key) => { composeState.decoration = key; });

    updatePreview();
    dialog.showModal();
  }

  document.getElementById('message-body').addEventListener('input', (e) => {
    document.getElementById('char-count').textContent = `${e.target.value.length} / ${MAX_MESSAGE_LENGTH}`;
    updatePreview();
  });

  document.getElementById('cancel-btn').addEventListener('click', () => dialog.close());

  document.getElementById('remove-btn').addEventListener('click', async () => {
    if (!myMessage || !confirm(t(dict, 'board.confirm_remove'))) return;
    await deleteMyMessage(supabaseClient, myMessage.id);
    dialog.close();
    await render();
  });

  composeForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById('compose-error');
    errorEl.textContent = '';
    const body = document.getElementById('message-body').value.trim();
    if (!body) return;

    try {
      await upsertMyMessage(supabaseClient, {
        boardId: board.id,
        userId: myId,
        existingId: myMessage?.id || null,
        slotIndex: composeSlot,
        body,
        font: composeState.font,
        noteColor: composeState.color,
        borderStyle: composeState.border,
        decoration: composeState.decoration,
      });
      dialog.close();
      await render();
    } catch (err) {
      errorEl.textContent = err.message === 'SLOT_TAKEN'
        ? t(dict, 'board.error_slot_taken')
        : t(dict, 'board.error_save');
      if (err.message === 'SLOT_TAKEN') { dialog.close(); await render(); }
    }
  });

  await render();
</script>
